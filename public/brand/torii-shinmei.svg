<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" fill="none" preserveAspectRatio="none" aria-hidden="true">
  <!--
    Shinmei torii a portale intero.
    Linee rette · kasagi cilindrico parallelo al suolo · niente gakuzuka.
  -->

  <!-- Hashira sinistro -->
  <rect x="20" y="44" width="14" height="276" fill="#6f5c42"/>
  <rect x="22" y="44" width="4" height="276" fill="#a89472" fill-opacity="0.35"/>

  <!-- Hashira destro -->
  <rect x="166" y="44" width="14" height="276" fill="#6f5c42"/>
  <rect x="174" y="44" width="4" height="276" fill="#a89472" fill-opacity="0.35"/>

  <!-- Nuki — attraversa i pilastri -->
  <rect x="14" y="50" width="172" height="9" fill="#5c4a34"/>
  <rect x="14" y="50" width="172" height="3" fill="#a89472" fill-opacity="0.25"/>

  <!-- Kasagi — dritto, cilindrico, sporge oltre gli hashira -->
  <rect x="6" y="12" width="188" height="14" rx="7" fill="#6f5c42"/>
  <rect x="10" y="15" width="180" height="4" rx="2" fill="#a89472" fill-opacity="0.3"/>

  <!-- Tratti hashira tra kasagi e nuki -->
  <rect x="20" y="26" width="14" height="24" fill="#6f5c42"/>
  <rect x="166" y="26" width="14" height="24" fill="#6f5c42"/>
</svg>
