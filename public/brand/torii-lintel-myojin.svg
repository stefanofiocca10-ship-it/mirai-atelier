<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 168" fill="none" aria-hidden="true">
  <!--
    My?jin torii — anatomia da diagramma:
    Kasagi · Shimaki · Daiwa · Gakuzuka · Kusabi · Nuki · Hashira (teste)
  -->
  <defs>
    <linearGradient id="woodV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a8260"/>
      <stop offset="35%" stop-color="#6f5c42"/>
      <stop offset="100%" stop-color="#3f3226"/>
    </linearGradient>
    <linearGradient id="woodH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f3226"/>
      <stop offset="18%" stop-color="#6f5c42"/>
      <stop offset="50%" stop-color="#a89472"/>
      <stop offset="82%" stop-color="#6f5c42"/>
      <stop offset="100%" stop-color="#3f3226"/>
    </linearGradient>
    <linearGradient id="woodPillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f3226"/>
      <stop offset="30%" stop-color="#a89472"/>
      <stop offset="55%" stop-color="#6f5c42"/>
      <stop offset="100%" stop-color="#3f3226"/>
    </linearGradient>
  </defs>

  <!-- Hashira (teste superiori, sotto daiwa fino sotto nuki) -->
  <rect x="48" y="78" width="40" height="90" fill="url(#woodPillar)"/>
  <rect x="712" y="78" width="40" height="90" fill="url(#woodPillar)"/>

  <!-- Daiwa (??) — anelli/capitelli in cima agli hashira -->
  <ellipse cx="68" cy="78" rx="28" ry="10" fill="#5c4a34"/>
  <ellipse cx="68" cy="74" rx="28" ry="9" fill="url(#woodV)"/>
  <ellipse cx="68" cy="70" rx="22" ry="5" fill="#a89472" fill-opacity="0.35"/>
  <ellipse cx="732" cy="78" rx="28" ry="10" fill="#5c4a34"/>
  <ellipse cx="732" cy="74" rx="28" ry="9" fill="url(#woodV)"/>
  <ellipse cx="732" cy="70" rx="22" ry="5" fill="#a89472" fill-opacity="0.35"/>

  <!-- Nuki (?) — attraversa gli hashira -->
  <rect x="36" y="128" width="728" height="20" fill="url(#woodV)"/>
  <rect x="36" y="128" width="728" height="6" fill="#a89472" fill-opacity="0.28"/>

  <!-- Kusabi (?) — cunei ai lati del nuki dove attraversa i pilastri -->
  <polygon points="48,126 62,126 56,118" fill="#3f3226"/>
  <polygon points="88,126 74,126 80,118" fill="#3f3226"/>
  <polygon points="48,150 62,150 56,158" fill="#3f3226"/>
  <polygon points="88,150 74,150 80,158" fill="#3f3226"/>
  <polygon points="712,126 726,126 720,118" fill="#3f3226"/>
  <polygon points="752,126 738,126 744,118" fill="#3f3226"/>
  <polygon points="712,150 726,150 720,158" fill="#3f3226"/>
  <polygon points="752,150 738,150 744,158" fill="#3f3226"/>

  <!-- Gakuzuka (??) — tra shimaki e nuki -->
  <rect x="372" y="78" width="56" height="50" fill="url(#woodV)"/>
  <rect x="380" y="86" width="40" height="34" fill="#efebe4" fill-opacity="0.45"/>
  <rect x="388" y="94" width="24" height="2.5" fill="#6f5c42" fill-opacity="0.45"/>
  <rect x="388" y="101" width="24" height="2.5" fill="#6f5c42" fill-opacity="0.45"/>
  <rect x="388" y="108" width="24" height="2.5" fill="#6f5c42" fill-opacity="0.45"/>

  <!-- Shimaki (??) — seconda trave sotto il kasagi, meno sporgente -->
  <path
    d="M70 78
       C 100 58, 140 52, 180 52
       H 620
       C 660 52, 700 58, 730 78
       V 86
       H 70
       Z"
    fill="url(#woodV)"
  />
  <path
    d="M90 78
       C 120 62, 160 58, 180 58
       H 620
       C 640 58, 680 62, 710 78
       V 82 H 90 Z"
    fill="#a89472"
    fill-opacity="0.22"
  />

  <!-- Kasagi (??) — trave superiore, estremità curve verso l'alto -->
  <path
    d="M20 72
       C 50 16, 110 4, 170 4
       H 630
       C 690 4, 750 16, 780 72
       L 752 78
       C 720 32, 680 24, 630 24
       H 170
       C 120 24, 80 32, 48 78
       Z"
    fill="url(#woodV)"
  />
  <!-- Highlight superiore kasagi -->
  <path
    d="M55 62
       C 85 22, 130 14, 170 14
       H 630
       C 670 14, 715 22, 745 62
       C 715 28, 670 24, 630 24
       H 170
       C 130 24, 85 28, 55 62
       Z"
    fill="#a89472"
    fill-opacity="0.32"
  />
</svg>
